services:
  redis:
    image: redis:alpine
    container_name: task_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - task-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: task_backend
    ports:
      - "5000:5000"
    env_file:
      - ./Backend/.env
    environment:
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - task-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: task_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - task-network

networks:
  task-network:
    driver: bridge
